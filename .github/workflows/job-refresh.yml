name: Scheduled job refresh verification
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production-job-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Wakes a sleeping API. Startup/minute tick claims only due provider slots
      # through the database lease. No admin endpoint or credentials are exposed.
      - name: Wake API and verify due ingestion completes
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request
          url = 'https://job-finder-ai-backend.onrender.com/api/ready'
          last = None
          deadline = time.monotonic() + 540
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      last = json.load(response)
                  if last.get('ready') and not last.get('running') and last.get('sources'):
                      print(json.dumps(last, indent=2))
                      failed = {name: info.get('error') for name, info in last['sources'].items() if info.get('status') == 'failed'}
                      if last.get('error') or failed:
                          raise SystemExit('Refresh verification failed: ' + json.dumps({'coordinator': last.get('error'), 'sources': failed}))
                      break
              except (OSError, ValueError) as error:
                  print('API warming/read failed:', type(error).__name__)
              time.sleep(15)
          else:
              print(json.dumps(last))
              raise SystemExit('API did not become ready within the verification window')
          PY
