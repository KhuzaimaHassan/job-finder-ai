<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Job Finder AI</title>
  <desc id="desc">Find roles that fit. Discover jobs, match your profile, prepare with AI, and track applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1225"/><stop offset="1" stop-color="#14142e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1010" cy="180" rx="390" ry="330" fill="url(#glow)"/>
  <rect x="0" y="58" width="5" height="244" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="87" font-size="17" font-weight="600" letter-spacing="3" fill="#93c5fd">YOUR NEXT OPPORTUNITY STARTS HERE</text>
    <text x="56" y="181" font-size="80" font-weight="700" letter-spacing="-3" fill="#f8fafc">Job Finder</text>
    <rect x="459" y="118" width="96" height="71" rx="18" fill="url(#accent)"/>
    <text x="507" y="168" text-anchor="middle" font-size="44" font-weight="700" fill="#0b1225">AI</text>
    <text x="60" y="238" font-size="31" fill="#cbd5e1">Find roles that fit. Make your next move.</text>
    <text x="60" y="293" font-size="18" fill="#94a3b8">Remote tech roles</text>
    <circle cx="233" cy="287" r="3" fill="#64748b"/>
    <text x="249" y="293" font-size="18" fill="#94a3b8">Resume matching</text>
    <circle cx="422" cy="287" r="3" fill="#64748b"/>
    <text x="438" y="293" font-size="18" fill="#94a3b8">Application Co-Pilot</text>
    <rect x="810" y="44" width="414" height="272" rx="20" fill="#111b32" stroke="#394566"/>
    <circle cx="834" cy="69" r="4" fill="#64748b"/><circle cx="849" cy="69" r="4" fill="#64748b"/><circle cx="864" cy="69" r="4" fill="#64748b"/>
    <text x="1198" y="74" text-anchor="end" font-size="12" letter-spacing="2" fill="#94a3b8">ONE WORKSPACE</text>
    <path d="M834 91H1200" stroke="#293650"/>
    <path d="M850 125V265" stroke="#334155" stroke-width="2"/>
    <g fill="#1e2b45" stroke="#475569">
      <circle cx="850" cy="126" r="14"/><circle cx="850" cy="173" r="14"/><circle cx="850" cy="220" r="14"/><circle cx="850" cy="267" r="14"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#93c5fd">
      <text x="850" y="130">01</text><text x="850" y="177">02</text><text x="850" y="224">03</text><text x="850" y="271">04</text>
    </g>
    <g font-size="21" font-weight="500" fill="#e2e8f0">
      <text x="880" y="133">Discover roles</text><text x="880" y="180">Match your profile</text><text x="880" y="227">Prepare with AI</text><text x="880" y="274">Track applications</text>
    </g>
  </g>
</svg>
